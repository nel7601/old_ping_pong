<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <title>OLD PING PONG</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="game"></canvas>

  <!-- Menú principal -->
  <div id="menu" class="screen">
    <h1 class="title">PONG</h1>
    <p class="subtitle">1972 &middot; DOS TELEFONOS &middot; UNA MESA</p>
    <button id="btn-create" class="btn">CREAR PARTIDA</button>
    <p class="hint">Crea una partida y comparte el enlace<br>con tu rival, este donde este.</p>
    <p id="menu-error" class="error"></p>
  </div>

  <!-- Esperando al rival -->
  <div id="waiting" class="screen hidden">
    <p class="label">ENLACE DE PARTIDA</p>
    <p id="share-url" class="link"></p>
    <button id="btn-share" class="btn">COMPARTIR ENLACE</button>
    <button id="btn-copy" class="btn small">COPIAR ENLACE</button>
    <p id="copy-done" class="error"></p>
    <p class="hint">Tu rival solo tiene que abrir el enlace.</p>
    <p class="blink">ESPERANDO RIVAL...</p>
    <button id="btn-cancel" class="btn small">CANCELAR</button>
  </div>

  <!-- Uniéndose desde un enlace -->
  <div id="joining" class="screen hidden">
    <p class="title small-title">PONG</p>
    <p class="blink">CONECTANDO...</p>
  </div>

  <!-- Fin de partida / desconexión -->
  <div id="over" class="screen hidden">
    <p id="over-title" class="title small-title">GAME OVER</p>
    <p id="over-detail" class="hint"></p>
    <button id="btn-rematch" class="btn">REVANCHA</button>
    <button id="btn-exit" class="btn small">SALIR</button>
  </div>

  <script src="game.js"></script>
</body>
</html>
